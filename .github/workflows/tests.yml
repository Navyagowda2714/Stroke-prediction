name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install flask==2.3.3 scikit-learn==1.6.1 numpy==1.26.4 google-generativeai==0.8.5 pytest==8.3.3
      - name: Run tests
        run: pytest -v
